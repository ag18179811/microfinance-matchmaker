<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Describe your business and get matched with CDFI and city microloan programs, plus a funding readiness score and coaching." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231C5E42'/%3E%3Cpath d='M8 20.5L13 14l4 4.5 7-9' stroke='%23F4EEE3' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='24' cy='9.5' r='2' fill='%23E8A33D'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,440;9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>Microfinance Matchmaker</title>
    <script>
      // Applies a saved theme choice before first paint, so switching pages
      // or reloading never flashes the wrong theme for a frame.
      (function () {
        try {
          var saved = localStorage.getItem('theme-preference');
          if (saved === 'light' || saved === 'dark') {
            document.documentElement.setAttribute('data-theme', saved);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
